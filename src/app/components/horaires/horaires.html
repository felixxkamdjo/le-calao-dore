<section id="horaires" class="horaires-section py-5">
  <div class="container">
    <div class="text-center mb-5">
      <span class="eyebrow">{{ eyebrow }}</span>
      <h2 class="section-title">{{ title }}</h2>
    </div>

    <div class="horaires-card">
      <ul class="horaires-list">
        @for (h of horaires; track h.jour) {
          <li [class.current-day]="h.jour === jourActuel">
            <span class="jour">{{ h.jour }}</span>

            @if (h.ferme) {
              <span class="statut ferme">Fermé</span>
            } @else {
              <span class="horaire">
                {{ h.ouverture }} - {{ h.fermeture }}
                @if (h.jour === jourActuel) {
                  <span class="statut ouvert">Ouvert aujourd'hui</span>
                }
              </span>
            }
          </li>
        }
      </ul>
    </div>
  </div>
</section>
