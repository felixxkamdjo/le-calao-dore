<section id="menu" class="container py-5 menu-section">
  <h2 class="text-center mb-5">Notre menu</h2>

  <div class="row">
    @for (dish of dishes; track dish.id) {
      <div class="col-12 col-md-6 col-lg-4 mb-4">
        <div class="card h-100 dish-card">
          <div class="card-body">
            <span
              class="badge"
              [class.bg-success]="dish.category === 'entree'"
              [class.bg-danger]="dish.category === 'plat'"
              [class.bg-warning]="dish.category === 'dessert'"
              [class.text-dark]="dish.category === 'dessert'">
              @switch (dish.category) {
                @case ('entree') { Entrée }
                @case ('plat') { Plat }
                @case ('dessert') { Dessert }
              }
            </span>

            <h5 class="card-title mt-2">{{ dish.name }}</h5>
            <p class="card-text text-muted">{{ dish.description }}</p>
            <p class="price fw-bold">{{ dish.price }} {{ currency }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</section>
